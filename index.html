<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caitlin's Bookshop</title>
  <meta name="theme-color" content="#b8476b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23b8476b'/><path d='M7 9c3-1.5 6-1.5 9 .5 3-2 6-2 9-.5v14c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="shopfront">
    <div class="awning" aria-hidden="true"></div>
    <div class="sign">
      <p class="eyebrow">Open late · Honest reviews</p>
      <h1><span class="owner" id="owner-name">Caitlin</span>’s Bookshop</h1>
      <p class="tagline">Where three stars is not an insult, and five stars is rare.</p>
      <hr class="sign-rule">
    </div>
    <p id="sync-status" class="sync-status off" role="status"></p>
    <nav class="nav" aria-label="Sections">
      <a href="#library">The shop</a>
      <a href="#find">Find a book</a>
      <a href="#tbr">Up next</a>
      <a href="#stats">Stats</a>
      <a href="#recs">For you</a>
      <a href="#settings">Settings</a>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <p>Book details from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> &amp; <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>.</p>
  </footer>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/api.js"></script>
  <script src="js/import.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
